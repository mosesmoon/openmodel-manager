name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for the Tauri app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The app crate embeds app/dist at compile time, so build the frontend first.
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bundle:
    needs: test
    # id-token and attestations: sign build provenance for tagged builds.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      # Windows: MSI installer + portable zip
      - if: runner.os == 'Windows'
        run: npx tauri build --bundles msi
        working-directory: app
      - if: runner.os == 'Windows'
        run: powershell -File packaging/windows-portable.ps1
      # Linux: AppImage + deb on Ubuntu 22.04 (glibc 2.35), then Flatpak
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak
      - if: runner.os == 'Linux'
        run: npx tauri build --bundles appimage,deb
        working-directory: app
      - if: runner.os == 'Linux'
        run: packaging/linux/build.sh flatpak
      # macOS: universal DMG (drag to Applications)
      - if: runner.os == 'macOS'
        run: npx tauri build --target universal-apple-darwin --bundles dmg
        working-directory: app
      # Gather this platform's installers in one folder.
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          for f in target/release/bundle/msi/*.msi target/release/bundle/portable/*.zip target/release/bundle/appimage/*.AppImage                    target/release/bundle/deb/*.deb target/release/bundle/flatpak/*.flatpak target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" out/
          done
          ls -la out
          test -n "$(ls out)"
      # Tagged builds: an SBOM of the source they were built from, and signed
      # attestations tying each installer to this repository, commit and
      # workflow run (check with `gh attestation verify <file> -R <repo>`).
      - if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: out-sbom.spdx.json
          upload-artifact: false
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-sbom@v2
        with:
          subject-path: out/*
          sbom-path: out-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: out/
          if-no-files-found: error
