name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for the Tauri app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The app crate embeds app/dist at compile time, so build the frontend first.
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      # Windows: MSI installer + portable zip
      - if: runner.os == 'Windows'
        run: npx tauri build --bundles msi
        working-directory: app
      - if: runner.os == 'Windows'
        run: powershell -File packaging/windows-portable.ps1
      # Linux: AppImage + deb on Ubuntu 22.04 (glibc 2.35), then Flatpak
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf flatpak
      - if: runner.os == 'Linux'
        run: npx tauri build --bundles appimage,deb
        working-directory: app
      - if: runner.os == 'Linux'
        run: packaging/linux/build.sh flatpak
      # macOS: universal DMG (drag to Applications)
      - if: runner.os == 'macOS'
        run: npx tauri build --target universal-apple-darwin --bundles dmg
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/msi/
            target/release/bundle/portable/
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/flatpak/
            target/universal-apple-darwin/release/bundle/dmg/
          if-no-files-found: error
